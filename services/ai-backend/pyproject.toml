[project]
name = "learnspace-ai-backend"
version = "0.1.0"
description = "Bounded asynchronous discovery agents for LearnSpace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai==1.15.33",
  "crewai-tools==1.15.33",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mangum==0.19.0",
  "pydantic==2.12.5",
  "redis==8.1.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "ruff==0.16.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
