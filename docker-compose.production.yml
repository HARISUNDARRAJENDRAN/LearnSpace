# Self-hosted production, layered on docker-compose.yml:
#   docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.production.yml up -d --build
# Its own project name keeps it apart from the development stack and its data.
# Nothing is published beyond loopback; Cloudflare Tunnel is the public entrance.
# PostgreSQL is hosted externally; .env.production holds one URL per database role.

name: learnspace-production

services:
  # Development's local database; production never starts it.
  postgres:
    profiles: ["local-database"]

  # Applies pending migrations once, before the web server starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    environment:
      DATABASE_MIGRATOR_URL: "${DATABASE_MIGRATOR_URL:?set DATABASE_MIGRATOR_URL}"
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:verify"]
    depends_on: !reset {}
    restart: "no"

  web:
    build:
      target: web
    command: !reset null
    volumes: !reset []
    environment:
      DATABASE_MIGRATOR_URL: !reset null
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      DATABASE_AUTH_URL: "${DATABASE_AUTH_URL:?set DATABASE_AUTH_URL}"
      DATABASE_WORKER_URL: "${DATABASE_WORKER_URL:?set DATABASE_WORKER_URL}"
      # Transaction-mode poolers cannot keep prepared statements across requests.
      DB_PREPARED_STATEMENTS: "false"
      APP_URL: "${APP_URL:?set APP_URL to the public https:// address}"
      GOOGLE_REDIRECT_URI: "${APP_URL}/api/auth/google/callback"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}"
      AUTH_SECURE_COOKIES: "true"
      # One web process, so in-memory rate-limit counters are complete.
      AUTH_RATE_LIMIT_BACKEND: memory
    depends_on: !override
      migrate:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  backend:
    environment:
      DATABASE_WORKER_URL: "${DATABASE_WORKER_URL:?set DATABASE_WORKER_URL}"
      DATABASE_AI_URL: "${DATABASE_AI_URL:?set DATABASE_AI_URL}"
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}"
    ports: !reset []

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
