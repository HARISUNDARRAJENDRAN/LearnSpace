AWSTemplateFormatVersion: '2010-09-09'
Description: One continuously running LearnSpace worker using existing hosted data stores.
Parameters:
  ImageUri:
    Type: String
  RuntimeSecretArn:
    Type: String
  InternalTokenSecretArn:
    Type: String
  AgentUrl:
    Type: String
  AppOrigin:
    Type: String
    Default: https://learnspace-staging.vercel.app
    AllowedPattern: '^https://[A-Za-z0-9.-]+$'
    Description: Exact HTTPS origin allowed to upload private PDFs; no path or wildcard.
  VercelTeamSlug:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_-]+$'
    Description: Team slug used by the LearnSpace staging project's Vercel OIDC subject and audience.
  VercelOidcProviderArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::934685482023:oidc-provider/oidc\.vercel\.com$'
    Description: Existing account-level Vercel OIDC provider; it is shared with production and must not be stack-owned.
  BuildSha:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: learnspace-worker-staging
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /learnspace/worker/staging
      RetentionInDays: 7
  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'learnspace-private-documents-staging-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AppOrigin
            AllowedMethods:
              - GET
              - PUT
            AllowedHeaders:
              - Content-Type
              - Content-Length
              - If-None-Match
              - Range
              - If-Range
            ExposedHeaders:
              - Accept-Ranges
              - Content-Length
              - Content-Range
              - ETag
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: expire-abandoned-document-uploads
            Status: Enabled
            Prefix: pending/
            ExpirationInDays: 1
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Worker outbound HTTPS and hosted PostgreSQL only; no inbound access.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 6543, ToPort: 6543, CidrIp: 0.0.0.0/0}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: learnspace-worker-staging-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: worker-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/learnspace-backend-staging'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref RuntimeSecretArn, !Ref InternalTokenSecretArn]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: learnspace-worker-staging-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: private-document-processing
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DocumentBucket.Arn}/pending/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DocumentBucket.Arn}/private/*'
              - Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - !Sub '${DocumentBucket.Arn}/pending/*'
                  - !Sub '${DocumentBucket.Arn}/private/*'
  WebStorageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: learnspace-web-staging-storage
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'oidc.vercel.com:aud': !Sub 'https://vercel.com/${VercelTeamSlug}'
                'oidc.vercel.com:sub': !Sub 'owner:${VercelTeamSlug}:project:learnspace-staging:environment:production'
      Policies:
        - PolicyName: private-document-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt DocumentBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub '${DocumentBucket.Arn}/pending/*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DocumentBucket.Arn}/private/*'
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: learnspace-worker-staging
      Tags:
        - {Key: LearnSpaceWorker, Value: staging}
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          Environment:
            - {Name: LEARNSPACE_BACKEND_MODE, Value: worker}
            - {Name: DISCOVERY_AGENT_URL, Value: !Ref AgentUrl}
            - {Name: S3_BUCKET, Value: !Ref DocumentBucket}
            - {Name: S3_REGION, Value: !Ref AWS::Region}
            - {Name: WORKER_BUILD_SHA, Value: !Ref BuildSha}
            - {Name: WORKER_HEARTBEAT_PATH, Value: /tmp/learnspace-worker-heartbeat}
            - {Name: NODE_OPTIONS, Value: '--max-old-space-size=256'}
          Secrets:
            - Name: DATABASE_WORKER_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:DATABASE_WORKER_URL::'
            - Name: OPENAI_API_KEY
              ValueFrom: !Sub '${RuntimeSecretArn}:OPENAI_API_KEY::'
            - Name: KV_REST_API_URL
              ValueFrom: !Sub '${RuntimeSecretArn}:KV_REST_API_URL::'
            - Name: KV_REST_API_TOKEN
              ValueFrom: !Sub '${RuntimeSecretArn}:KV_REST_API_TOKEN::'
            - Name: INTERNAL_SERVICE_TOKEN
              ValueFrom: !Sub '${InternalTokenSecretArn}:INTERNAL_SERVICE_TOKEN::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          HealthCheck:
            Command: [CMD-SHELL, 'node -e "process.exit(Date.now()-Number(require(''fs'').readFileSync(process.env.WORKER_HEARTBEAT_PATH,''utf8''))<180000?0:1)"']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: learnspace-worker-staging
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SecurityGroup]
Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  DocumentBucketName:
    Value: !Ref DocumentBucket
  WebStorageRoleArn:
    Value: !GetAtt WebStorageRole.Arn
