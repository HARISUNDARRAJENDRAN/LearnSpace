    <meta charset="UTF-8" />

    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Serif";
        src: url("assets/fonts/GeistSerif-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      /* LearnSpace marketing tokens (apps/web/app/globals.css) */
      :root {
        --ground: #f4f8fb;
        --ink: #090b0c;
        --ink-muted: #737373;
        --brand: #00a5ef;
        --brand-ink: #0084cc;
        --sky: #9ed4ef;
        --sky-light: #d1eef9;
        --font-display: "Geist", "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1200px 700px at 50% 115%, var(--sky-light), transparent 70%),
          radial-gradient(900px 500px at 12% -10%, #e6f4fb, transparent 70%),
          var(--ground);
      }

      /* Fades whatever the camera pushes into out from under the titles. */
      #veil {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 260px;
        z-index: 15;
        background: linear-gradient(#f4f8fb 62%, rgb(244 248 251 / 0%));
        pointer-events: none;
      }

      /* Shared pieces every scene uses */
      .title {
        position: absolute;
        left: 0;
        right: 0;
        top: 74px;
        text-align: center;
        font-size: 64px;
        font-weight: 520;
        letter-spacing: -0.035em;
        line-height: 1.1;
        white-space: nowrap;
        z-index: 20;
      }
      .title.center {
        top: 486px;
        font-size: 96px;
      }
      .title .w {
        display: inline-block;
        opacity: 0;
      }
      .accent {
        color: var(--brand-ink);
      }
      /* A captured app screen: 1600×1000 CSS px, the size it was captured at, so overlays use screenshot coordinates. */
      .shot {
        position: absolute;
        left: 160px;
        top: 40px;
        width: 1600px;
        height: 1000px;
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 0 0 1px rgb(10 30 50 / 8%),
          0 30px 80px -20px rgb(20 60 90 / 28%),
          0 12px 30px -12px rgb(20 60 90 / 18%);
        opacity: 0;
      }
      .shot > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shot .mark {
        position: absolute;
        border-radius: 10px;
        opacity: 0;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 46px;
        height: 56px;
        z-index: 50;
        opacity: 0;
        filter: drop-shadow(0 6px 10px rgb(0 0 0 / 25%));
      }
    </style>
    <script>
      // Camera helpers shared by the scenes. A .shot sits at left 160, top 40 and scales about its centre.
      window.LS = {
        /** GSAP vars that put screenshot point (px, py) at frame point (fx, fy) at scale s. */
        focus(px, py, s, fx = 960, fy = 540) {
          return { x: fx - 960 - s * (px - 800), y: fy - 540 - s * (py - 500), scale: s };
        },
        /** Frame point where screenshot point (px, py) lands under camera vars cam. */
        at(px, py, cam) {
          return { x: 960 + cam.scale * (px - 800) + cam.x, y: 540 + cam.scale * (py - 500) + cam.y };
        },
        /** Seeded PRNG so every render scatters things the same way. */
        rng(seed) {
          return () => {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        },
        /** Per-word blur-in for a .title's .w spans. */
        words(tl, sel, at, gap = 0.07) {
          tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: gap }, at);
        },
        /** Blur-out exit for a title. */
        out(tl, sel, at) {
          tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, at);
        },
        /** Cursor glides to (x, y), then presses. Returns the press time. */
        click(tl, sel, from, to, at, travel = 0.5) {
          tl.fromTo(sel, { x: from.x, y: from.y, opacity: 0 }, { opacity: 1, duration: 0.12 }, at);
          tl.to(sel, { x: to.x, y: to.y, duration: travel, ease: "power3.inOut" }, at);
          tl.to(sel, { scale: 0.82, duration: 0.07, ease: "power2.in", transformOrigin: "0 0" }, at + travel + 0.05);
          tl.to(sel, { scale: 1, duration: 0.12, ease: "power2.out" }, at + travel + 0.12);
          return at + travel + 0.12;
        },
      };
    </script>
