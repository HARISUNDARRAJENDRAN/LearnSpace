name: Deploy tested main to Vercel production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: learnspace-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DB_POOL_MAX: "1"
      DB_CONNECT_TIMEOUT_SECONDS: "10"
      DB_IDLE_TIMEOUT_SECONDS: "20"
      DB_MAX_LIFETIME_SECONDS: "300"
      DB_PREPARED_STATEMENTS: "false"
      DB_STATEMENT_TIMEOUT_MS: "3000"
      DB_LOCK_TIMEOUT_MS: "500"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify this is still the current main commit
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: pnpm run db:check
      - run: pnpm run db:migrate
      - run: pnpm run db:verify
      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@51.7.0 pull --yes --environment=production --cwd apps/web --token "$VERCEL_TOKEN"
      - name: Build the tested commit for Vercel
        run: pnpm dlx vercel@51.7.0 build --prod --cwd apps/web --token "$VERCEL_TOKEN"
      - name: Deploy the prebuilt artifact to production
        run: pnpm dlx vercel@51.7.0 deploy --prebuilt --prod --yes --cwd apps/web --token "$VERCEL_TOKEN"
