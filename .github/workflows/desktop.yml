name: Desktop

# Installers must be built on their own operating system; each runner
# packages its platform and uploads the result as a workflow artifact.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @learnspace/desktop
      - run: pnpm --filter @learnspace/desktop test
      - run: pnpm --filter @learnspace/desktop dist
        env:
          # Builds are unsigned until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learnspace-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/LearnSpace-*
            !apps/desktop/release/*.blockmap
          if-no-files-found: error
