name: Desktop

# Installers must be built on their own operating system; each runner
# packages its platform and uploads the result as a workflow artifact.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @learnspace/desktop
      - run: pnpm --filter @learnspace/desktop test
      - run: pnpm --filter @learnspace/desktop dist
        env:
          # Builds are unsigned until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Launch the packaged app
        shell: bash
        working-directory: apps/desktop
        env:
          LEARNSPACE_URL: https://example.com
        run: |
          case "$RUNNER_OS" in
            Linux)
              # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              app=(xvfb-run -a release/linux-unpacked/learnspace) ;;
            Windows) app=(release/win-unpacked/LearnSpace.exe) ;;
            macOS) app=(release/mac-universal/LearnSpace.app/Contents/MacOS/LearnSpace) ;;
          esac
          "${app[@]}" --remote-debugging-port=9222 > app.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s http://127.0.0.1:9222/json | grep -q '"url": "https://example.com/app"'; then
              echo "LearnSpace opened its window on $RUNNER_OS"
              exit 0
            fi
            sleep 1
          done
          cat app.log
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: learnspace-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/LearnSpace-*
            !apps/desktop/release/*.blockmap
          if-no-files-found: error
