name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the verified commit to the configured staging services.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      DATABASE_AUTH_URL: postgres://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: docker compose config --quiet
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - name: Build both application images and verify the packaged worker runtime
        run: |
          docker build --file Dockerfile --tag learnspace-frontend:ci .
          docker build --file Dockerfile.backend --tag learnspace-backend:ci .
          docker run --rm --entrypoint node learnspace-backend:ci --input-type=module -e "import '/worker/dist/discovery.js'; import { access } from 'node:fs/promises'; await access(process.env.CURRICULUM_PATH); if (process.getuid() === 0) throw new Error('worker must run without root');"
          [[ "$(docker inspect --format '{{.Config.User}}' learnspace-frontend:ci)" == nextjs ]]
          [[ "$(docker inspect --format '{{.Config.User}}' learnspace-backend:ci)" == learnspace ]]
          cleanup() {
            docker rm --force learnspace-frontend-smoke learnspace-backend-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name learnspace-backend-smoke --publish 18080:8080 \
            --env LEARNSPACE_BACKEND_MODE=api --env INTERNAL_SERVICE_TOKEN=ci-smoke-token \
            learnspace-backend:ci > /dev/null
          docker run --detach --name learnspace-frontend-smoke --no-healthcheck --publish 13000:3000 \
            --env APP_URL=https://learnspace.invalid learnspace-frontend:ci > /dev/null
          for _attempt in {1..30}; do
            if curl --fail --silent http://localhost:18080/readyz > /dev/null && \
              curl --fail --silent http://localhost:13000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:18080/readyz | jq -e '.status == "ready"' > /dev/null
          docker exec learnspace-backend-smoke python -c "import os; assert os.getuid() == 10001"
          docker exec learnspace-frontend-smoke node -e "if (process.getuid() !== 1001) process.exit(1)"
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:13000/)" == 200 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:13000/login)" == 200 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:13000/app)" == 307 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'x-learnspace-desktop: 1' http://localhost:13000/login)" == 200 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'x-learnspace-desktop: 1' http://localhost:13000/app)" == 307 ]]
          echo "Production image startup and desktop-route smoke checks passed."

  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://learnspace_app:learnspace_app@localhost:55432/learnspace
      DATABASE_MIGRATOR_URL: postgres://learnspace_migrator:learnspace_migrator@localhost:55432/learnspace
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:55432/learnspace
      DATABASE_AUTH_URL: postgres://learnspace_auth:learnspace_auth@localhost:55432/learnspace
      DATABASE_APP_URL: postgres://learnspace_app:learnspace_app@localhost:55432/learnspace
      DATABASE_AI_URL: postgres://learnspace_ai:learnspace_ai@localhost:55432/learnspace
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@localhost:55432/learnspace
      DATABASE_RUNNER_URL: postgres://learnspace_runner:learnspace_runner@localhost:55432/learnspace
      REDIS_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run db:check
      - run: docker compose up -d --wait postgres redis
      - run: pnpm run db:migrate
      - run: pnpm run db:verify
      - run: pnpm run db:seed:dev
      # The worker test owns the discovery queue; run it before web tests enqueue jobs.
      - run: pnpm --filter @learnspace/worker test
        env:
          LEARNSPACE_SEMANTIC_DISCOVERY_ENABLED: "false"
      - run: pnpm --filter @learnspace/shared test
      - run: pnpm --filter @learnspace/web test
      - run: pnpm run db:test
      - run: pnpm --filter @learnspace/web exec playwright install --with-deps chromium
      - run: pnpm --filter @learnspace/web run test:e2e:production
      - name: Verify auth layouts against production server
        run: |
          APP_URL=https://learnspace.invalid AUTH_SECRET=ci-auth-layout-secret-long-enough-to-pass-validation \
            PORT=3200 pnpm --filter @learnspace/web run start:standalone > /tmp/learnspace-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent --header 'x-learnspace-desktop: 1' http://localhost:3200/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --header 'x-learnspace-desktop: 1' http://localhost:3200/login > /dev/null
          APP_URL=https://learnspace.invalid BASE_URL=http://localhost:3200 \
            pnpm --filter @learnspace/web run verify:auth-layout
      - run: pnpm run db:ledger > before
      - run: pnpm run db:migrate
      - run: pnpm run db:verify
      - run: pnpm run db:ledger > after
      - run: diff -u before after
      - if: always()
        run: docker compose down -v

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --format requirements.txt --output-file /tmp/learnspace-python-requirements.txt
      # crewai-tools pulls ChromaDB transitively, but LearnSpace never exposes or starts its Chroma server.
      # These advisories currently have no upstream fix; keep the audit strict for every other dependency.
      - run: >-
          uvx --python 3.13 pip-audit --strict
          --requirement /tmp/learnspace-python-requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813
      - run: uv run ruff check app tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run ruff check ../../infra/aws/discovery-agent
      - run: uv run python -m unittest discover -s ../../infra/aws/discovery-agent -p 'test_*.py'
      - run: for script in ../../infra/aws/discovery-agent/*.sh ../../infra/aws/worker/*.sh; do bash -n "$script"; done
      - run: uv run ruff check ../../infra/aws/worker
      - run: uv run python -m unittest discover -s ../../infra/aws/worker -p 'test_*.py'

  deploy-agent:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_staging && needs.foundation.result == 'success' && needs.database.result == 'success' && needs.python.result == 'success'
    needs: [foundation, database, python]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      LEARNSPACE_STAGE: staging
      AWS_STACK_NAME: learnspace-discovery-agent-staging
      AWS_FUNCTION_NAME: learnspace-discovery-agent-staging
      AWS_ECR_REPOSITORY: learnspace-backend-staging
      IMAGE_TAG: ${{ github.sha }}
      EXA_API_KEY_SECRET_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_EXA_API_KEY_SECRET_ARN }}
      INTERNAL_SERVICE_TOKEN_SECRET_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_INTERNAL_TOKEN_SECRET_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check AWS deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_ROLE_ARN }}
          AWS_EXA_SECRET_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_EXA_API_KEY_SECRET_ARN }}
          AWS_INTERNAL_TOKEN_SECRET_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_INTERNAL_TOKEN_SECRET_ARN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
          STAGING_DATABASE_WORKER_URL: ${{ secrets.STAGING_DATABASE_WORKER_URL }}
          STAGING_DISCOVERY_AGENT_URL: ${{ secrets.STAGING_DISCOVERY_AGENT_URL }}
          STAGING_INTERNAL_SERVICE_TOKEN: ${{ secrets.STAGING_INTERNAL_SERVICE_TOKEN }}
          STAGING_DISCOVERY_SMOKE_EMAIL: ${{ secrets.STAGING_DISCOVERY_SMOKE_EMAIL }}
          STAGING_DISCOVERY_SMOKE_PASSWORD: ${{ secrets.STAGING_DISCOVERY_SMOKE_PASSWORD }}
          STAGING_VERCEL_TEAM_SLUG: ${{ vars.STAGING_VERCEL_TEAM_SLUG }}
          STAGING_VERCEL_OIDC_PROVIDER_ARN: ${{ vars.STAGING_VERCEL_OIDC_PROVIDER_ARN }}
        run: |
          missing=0
          for variable in AWS_ROLE_ARN AWS_EXA_SECRET_ARN AWS_INTERNAL_TOKEN_SECRET_ARN \
            VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN \
            STAGING_DATABASE_MIGRATOR_URL STAGING_DATABASE_WORKER_URL \
            STAGING_DISCOVERY_AGENT_URL STAGING_INTERNAL_SERVICE_TOKEN \
            STAGING_DISCOVERY_SMOKE_EMAIL STAGING_DISCOVERY_SMOKE_PASSWORD \
            STAGING_VERCEL_TEAM_SLUG STAGING_VERCEL_OIDC_PROVIDER_ARN; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is not configured; deployment cannot be verified."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          project="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if ! jq -e '.name == "learnspace-staging"' <<< "$project" > /dev/null; then
            echo "::error::VERCEL_PROJECT_ID is not the learnspace-staging project."
            exit 1
          fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DISCOVERY_AGENT_ROLE_ARN }}
      - name: Deploy the tested discovery agent
        run: |
          bash infra/aws/discovery-agent/deploy.sh
          echo "AGENT_DEPLOYED build=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the instant discovery route
        run: |
          # AgentUrl is a literal in the JMESPath expression.
          # shellcheck disable=SC2016
          agent_url="$(aws cloudformation describe-stacks --stack-name "$AWS_STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].Outputs[?OutputKey==`AgentUrl`].OutputValue | [0]' --output text)"
          token="$(aws secretsmanager get-secret-value --secret-id "$INTERNAL_SERVICE_TOKEN_SECRET_ARN" --region "$AWS_REGION" --query SecretString --output text | jq -r '.INTERNAL_SERVICE_TOKEN')"
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            -H "x-internal-service-token: $token" \
            -d "{\"query_text\":\"deployment smoke test\",\"source_kind\":\"video\",\"ranking_intent\":\"best_match\",\"limit\":1,\"trace_id\":\"deploy-$GITHUB_SHA\"}" \
            "${agent_url%/}/internal/v1/discovery/instant" \
            | jq -e '(.youtube | type == "array") and (.arxiv | type == "array") and (.failures | type == "array")' > /dev/null
          version="$(curl --fail --silent --show-error --max-time 10 -H "x-internal-service-token: $token" "${agent_url%/}/internal/v1/discovery/version")"
          if ! echo "$version" | jq -e --arg sha "$GITHUB_SHA" '.buildSha == $sha and .protocolVersion == "source-discovery-v3" and .schemaVersion == "1"' > /dev/null; then
            echo "AGENT_INCOMPATIBLE — deployed discovery agent failed the build/protocol/schema check." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "AGENT_VERIFIED build=$GITHUB_SHA protocol=source-discovery-v3 schema=1" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_staging && needs.foundation.result == 'success' && needs.database.result == 'success' && needs.python.result == 'success'
    needs: [foundation, database, python, deploy-agent]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      WORKER_RUNTIME_SECRET_ARN: arn:aws:secretsmanager:us-east-1:934685482023:secret:learnspace/staging/worker/runtime-fEGrXW
      INTERNAL_SERVICE_TOKEN_SECRET_ARN: ${{ secrets.AWS_DISCOVERY_AGENT_INTERNAL_TOKEN_SECRET_ARN }}
      DISCOVERY_AGENT_URL: ${{ secrets.STAGING_DISCOVERY_AGENT_URL }}
      DATABASE_WORKER_URL: ${{ secrets.STAGING_DATABASE_WORKER_URL }}
      WORKER_VPC_ID: vpc-02c4dca1203de4511
      WORKER_SUBNET_IDS: subnet-08f5e6209ec1bf17f,subnet-00acc9ce2c21bed83
      VERCEL_TEAM_SLUG: ${{ vars.STAGING_VERCEL_TEAM_SLUG }}
      VERCEL_OIDC_PROVIDER_ARN: ${{ vars.STAGING_VERCEL_OIDC_PROVIDER_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assume the staging deployment role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DISCOVERY_AGENT_ROLE_ARN }}
      - name: Verify the staging Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          project="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          if ! jq -e '.name == "learnspace-staging"' <<< "$project" > /dev/null; then
            echo "::error::VERCEL_PROJECT_ID is not the learnspace-staging project."
            exit 1
          fi
      - run: pnpm run db:check
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
      - run: pnpm run db:migrate
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
          DB_POOL_MAX: "1"
          DB_CONNECT_TIMEOUT_SECONDS: "10"
          DB_IDLE_TIMEOUT_SECONDS: "20"
          DB_MAX_LIFETIME_SECONDS: "300"
          DB_PREPARED_STATEMENTS: "false"
          DB_STATEMENT_TIMEOUT_MS: "3000"
          DB_LOCK_TIMEOUT_MS: "500"
      - run: pnpm run db:verify
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
          DB_POOL_MAX: "1"
          DB_CONNECT_TIMEOUT_SECONDS: "10"
          DB_IDLE_TIMEOUT_SECONDS: "20"
          DB_MAX_LIFETIME_SECONDS: "300"
          DB_PREPARED_STATEMENTS: "false"
          DB_STATEMENT_TIMEOUT_MS: "3000"
          DB_LOCK_TIMEOUT_MS: "500"
      - name: Verify the Vercel OIDC provider audience
        env:
          VERCEL_OIDC_PROVIDER_ARN: ${{ vars.STAGING_VERCEL_OIDC_PROVIDER_ARN }}
          VERCEL_TEAM_SLUG: ${{ vars.STAGING_VERCEL_TEAM_SLUG }}
        run: |
          provider="$(aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$VERCEL_OIDC_PROVIDER_ARN")"
          if ! jq -e --arg audience "https://vercel.com/$VERCEL_TEAM_SLUG" '.ClientIDList | index($audience) != null' <<< "$provider" > /dev/null; then
            echo "::error::The shared Vercel OIDC provider is missing the staging team audience."
            exit 1
          fi
      - name: Configure and deploy the continuous worker
        run: |
          python3 infra/aws/worker/configure-runtime.py
          bash infra/aws/worker/deploy.sh
      - name: Sync private storage outputs to staging Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bucket="$(aws cloudformation describe-stacks --stack-name learnspace-worker-staging --region "$AWS_REGION" --query 'Stacks[0].Outputs[?OutputKey==`DocumentBucketName`].OutputValue | [0]' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name learnspace-worker-staging --region "$AWS_REGION" --query 'Stacks[0].Outputs[?OutputKey==`WebStorageRoleArn`].OutputValue | [0]' --output text)"
          if [[ -z "$bucket" || "$bucket" == None || -z "$role_arn" || "$role_arn" == None ]]; then
            echo "::error::The worker stack did not return its private-storage outputs."
            exit 1
          fi
          for entry in "S3_BUCKET:$bucket" "S3_REGION:$AWS_REGION" "AWS_ROLE_ARN:$role_arn"; do
            key="${entry%%:*}"
            value="${entry#*:}"
            body="$(jq -nc --arg key "$key" --arg value "$value" '{key:$key,value:$value,type:"plain",target:["production"]}')"
            response="$(curl --fail --silent --show-error --max-time 15 \
              --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID")"
            if ! jq -e '.failed | length == 0' <<< "$response" > /dev/null; then
              echo "::error::Unable to configure $key on the staging Vercel project."
              exit 1
            fi
          done
      - name: Deploy the tested source to the configured staging Vercel project
        # Vercel's local builder is incompatible with pnpm monorepos outside Vercel infrastructure.
        # Remote deployment builds this exact checked-out commit on Vercel instead.
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx --allow-build=esbuild vercel@51.7.0 deploy --prod --yes --token "$VERCEL_TOKEN"
      - run: pnpm --filter @learnspace/shared build
      - name: Hosted smoke through the deployed worker and authenticated web app
        run: pnpm discovery:smoke
        env:
          DATABASE_MIGRATOR_URL: ${{ secrets.STAGING_DATABASE_MIGRATOR_URL }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.STAGING_INTERNAL_SERVICE_TOKEN }}
          DISCOVERY_SMOKE_WEB_URL: https://learnspace-staging.vercel.app
          DISCOVERY_SMOKE_EMAIL: ${{ secrets.STAGING_DISCOVERY_SMOKE_EMAIL }}
          DISCOVERY_SMOKE_PASSWORD: ${{ secrets.STAGING_DISCOVERY_SMOKE_PASSWORD }}
          DISCOVERY_SMOKE_REQUIRE_PROVIDER: "true"
          DISCOVERY_SMOKE_EXTERNAL_WORKER: "true"
          DISCOVERY_SMOKE_TIMEOUT_MS: "360000"
      - name: Verify the deployed application and required dependencies
        run: curl --fail --silent --show-error --max-time 20 "$DISCOVERY_SMOKE_WEB_URL/api/health" > /dev/null
        env:
          DISCOVERY_SMOKE_WEB_URL: https://learnspace-staging.vercel.app
