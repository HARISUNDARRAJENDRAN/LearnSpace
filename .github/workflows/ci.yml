name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://build:build@localhost:5432/build
      DATABASE_AUTH_URL: postgres://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose config --quiet
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build

  database:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://learnspace_app:learnspace_app@localhost:55432/learnspace
      DATABASE_MIGRATOR_URL: postgres://learnspace_migrator:learnspace_migrator@localhost:55432/learnspace
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:55432/learnspace
      DATABASE_AUTH_URL: postgres://learnspace_auth:learnspace_auth@localhost:55432/learnspace
      DATABASE_APP_URL: postgres://learnspace_app:learnspace_app@localhost:55432/learnspace
      DATABASE_AI_URL: postgres://learnspace_ai:learnspace_ai@localhost:55432/learnspace
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@localhost:55432/learnspace
      DATABASE_RUNNER_URL: postgres://learnspace_runner:learnspace_runner@localhost:55432/learnspace
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run db:check
      - run: docker compose up -d --wait postgres
      - run: pnpm run db:migrate
      - run: pnpm run db:verify
      - run: pnpm run db:seed:dev
      - run: pnpm run test
      - run: pnpm run db:test
      - run: pnpm --filter @learnspace/web exec playwright install --with-deps chromium
      - run: pnpm --filter @learnspace/web run test:e2e
      - run: pnpm run db:ledger > before
      - run: pnpm run db:migrate
      - run: pnpm run db:verify
      - run: pnpm run db:ledger > after
      - run: diff -u before after
      - if: always()
        run: docker compose down -v

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pyright
      - run: uv run pytest
