[package]
name = "learnspace-pdf-parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf-inspector = { path = "../../../vendor/pdf-inspector-researchpapers" }
lopdf = { version = "0.42.0", features = ["rayon"] }
napi = { version = "3.0.0", features = ["serde-json"] }
napi-derive = "3.0.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "debuginfo"
