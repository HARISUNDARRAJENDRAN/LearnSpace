name: learnspace

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnspace
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - learnspace_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnspace"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    environment:
      DATABASE_MIGRATOR_URL: postgres://learnspace_migrator:learnspace_migrator@postgres:5432/learnspace
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:verify && pnpm db:seed:dev"]

  ai:
    build:
      context: ./services/ai-backend
      dockerfile: Dockerfile
    environment:
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-local-development-internal-token}"
      DISCOVERY_AGENTS_ENABLED: "${DISCOVERY_AGENTS_ENABLED:-false}"
      EXA_API_KEY: "${EXA_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DISCOVERY_YOUTUBE_ENRICHMENT_ENABLED: "${DISCOVERY_YOUTUBE_ENRICHMENT_ENABLED:-false}"
      DISCOVERY_YOUTUBE_EMBEDDER_PROVIDER: "${DISCOVERY_YOUTUBE_EMBEDDER_PROVIDER:-openai}"
      DISCOVERY_YOUTUBE_EMBEDDER_MODEL: "${DISCOVERY_YOUTUBE_EMBEDDER_MODEL:-text-embedding-3-small}"
      DISCOVERY_MAX_CONCURRENCY: "${DISCOVERY_MAX_CONCURRENCY:-2}"
      DISCOVERY_MAX_TOOL_CALLS: "${DISCOVERY_MAX_TOOL_CALLS:-4}"
      DISCOVERY_REQUEST_TIMEOUT_SECONDS: "${DISCOVERY_REQUEST_TIMEOUT_SECONDS:-8}"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${AI_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: postgres://learnspace_app:learnspace_app@postgres:5432/learnspace
      DATABASE_AUTH_URL: postgres://learnspace_auth:learnspace_auth@postgres:5432/learnspace
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@postgres:5432/learnspace
      DB_POOL_MAX: "10"
      DB_CONNECT_TIMEOUT_SECONDS: "10"
      DB_IDLE_TIMEOUT_SECONDS: "20"
      DB_MAX_LIFETIME_SECONDS: "3600"
      DB_PREPARED_STATEMENTS: "true"
      DB_STATEMENT_TIMEOUT_MS: "3000"
      DB_LOCK_TIMEOUT_MS: "500"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      DISCOVERY_AGENT_URL: http://ai:8080
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-local-development-internal-token}"
      AUTH_SECRET: "${AUTH_SECRET:-local-development-auth-secret-change-me-please}"
      AUTH_SECURE_COOKIES: "${AUTH_SECURE_COOKIES:-false}"
      AUTH_RATE_LIMIT_BACKEND: "${AUTH_RATE_LIMIT_BACKEND:-memory}"
      AUTH_EXPOSE_VERIFICATION_LINK: "${AUTH_EXPOSE_VERIFICATION_LINK:-true}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}"
      KV_URL: "${KV_URL:-}"
      KV_REST_API_URL: "${KV_REST_API_URL:-}"
      KV_REST_API_TOKEN: "${KV_REST_API_TOKEN:-}"
      KV_REST_API_READ_ONLY_TOKEN: "${KV_REST_API_READ_ONLY_TOKEN:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-LearnSpace <noreply@example.com>}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - learnspace_node_modules:/workspace/node_modules
      - learnspace_web_node_modules:/workspace/apps/web/node_modules
      - learnspace_db_node_modules:/workspace/packages/db/node_modules
      - learnspace_shared_node_modules:/workspace/packages/shared/node_modules
      - learnspace_runner_node_modules:/workspace/services/runner/node_modules
      - learnspace_worker_node_modules:/workspace/services/worker/node_modules
      - learnspace_web_next:/workspace/apps/web/.next
    command: ["sh", "-c", "pnpm --filter @learnspace/shared build && pnpm --filter @learnspace/db build && find apps/web/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} + && exec pnpm --filter @learnspace/web dev --hostname 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      NODE_ENV: production
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@postgres:5432/learnspace
      DATABASE_AI_URL: postgres://learnspace_ai:learnspace_ai@postgres:5432/learnspace
      DISCOVERY_AGENT_URL: http://ai:8080
      INTERNAL_SERVICE_TOKEN: "${INTERNAL_SERVICE_TOKEN:-local-development-internal-token}"
      DISCOVERY_WORKER_INTERVAL_MS: "${DISCOVERY_WORKER_INTERVAL_MS:-30000}"
      DISCOVERY_WORKER_MAX_JOBS: "${DISCOVERY_WORKER_MAX_JOBS:-0}"
      DISCOVERY_AGENT_TIMEOUT_SECONDS: "${DISCOVERY_AGENT_TIMEOUT_SECONDS:-120}"
      DISCOVERY_REFRESH_FAST_HOURS: "${DISCOVERY_REFRESH_FAST_HOURS:-12}"
      DISCOVERY_REFRESH_MEDIUM_HOURS: "${DISCOVERY_REFRESH_MEDIUM_HOURS:-24}"
      DISCOVERY_REFRESH_SLOW_HOURS: "${DISCOVERY_REFRESH_SLOW_HOURS:-72}"
      DISCOVERY_REFRESH_JITTER_PERCENT: "${DISCOVERY_REFRESH_JITTER_PERCENT:-0.1}"
      DISCOVERY_REFRESH_DEDUP_HOURS: "${DISCOVERY_REFRESH_DEDUP_HOURS:-12}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    volumes:
      - .:/workspace
      - learnspace_node_modules:/workspace/node_modules
      - learnspace_web_node_modules:/workspace/apps/web/node_modules
      - learnspace_db_node_modules:/workspace/packages/db/node_modules
      - learnspace_shared_node_modules:/workspace/packages/shared/node_modules
      - learnspace_runner_node_modules:/workspace/services/runner/node_modules
      - learnspace_worker_node_modules:/workspace/services/worker/node_modules
    command: ["sh", "-c", "pnpm --filter '@learnspace/worker...' run build && exec node services/worker/dist/index.js --loop"]
    restart: unless-stopped

volumes:
  learnspace_postgres_data:
  learnspace_node_modules:
  learnspace_web_node_modules:
  learnspace_db_node_modules:
  learnspace_shared_node_modules:
  learnspace_runner_node_modules:
  learnspace_worker_node_modules:
  learnspace_web_next:
