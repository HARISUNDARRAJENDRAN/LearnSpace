name: learnspace

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnspace
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - learnspace_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learnspace"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Next.js UI and API. Installs dependencies, migrates and seeds the
  # database, then serves the mounted source with hot reload.
  web:
    mem_limit: ${WEB_MEMORY_LIMIT:-1536m}
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      # Turbopack compiles natively, outside the JS heap; next dev restarts itself near this cap.
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_MIGRATOR_URL: postgres://learnspace_migrator:learnspace_migrator@postgres:5432/learnspace
      DATABASE_URL: postgres://learnspace_app:learnspace_app@postgres:5432/learnspace
      DATABASE_AUTH_URL: postgres://learnspace_auth:learnspace_auth@postgres:5432/learnspace
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@postgres:5432/learnspace
      DB_POOL_MAX: "5"
      DB_CONNECT_TIMEOUT_SECONDS: "10"
      DB_IDLE_TIMEOUT_SECONDS: "20"
      DB_MAX_LIFETIME_SECONDS: "3600"
      DB_PREPARED_STATEMENTS: "true"
      DB_STATEMENT_TIMEOUT_MS: "3000"
      DB_LOCK_TIMEOUT_MS: "500"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      # The source picker searches Exa directly for instant results.
      EXA_API_KEY: "${EXA_API_KEY:-}"
      # The study tutor (GPT-6 Luna) and its query embeddings.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AUTH_SECRET: "${AUTH_SECRET:-local-development-auth-secret-change-me-please}"
      AUTH_SECURE_COOKIES: "${AUTH_SECURE_COOKIES:-false}"
      AUTH_EXPOSE_VERIFICATION_LINK: "${AUTH_EXPOSE_VERIFICATION_LINK:-true}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}"
      LEARNSPACE_SEMANTIC_DISCOVERY_ENABLED: "${LEARNSPACE_SEMANTIC_DISCOVERY_ENABLED:-true}"
      KV_URL: "${KV_URL:-}"
      KV_REST_API_URL: "${KV_REST_API_URL:-}"
      KV_REST_API_TOKEN: "${KV_REST_API_TOKEN:-}"
      KV_REST_API_READ_ONLY_TOKEN: "${KV_REST_API_READ_ONLY_TOKEN:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-LearnSpace <noreply@example.com>}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - learnspace_node_modules:/workspace/node_modules
      - learnspace_web_node_modules:/workspace/apps/web/node_modules
      - learnspace_db_node_modules:/workspace/packages/db/node_modules
      - learnspace_shared_node_modules:/workspace/packages/shared/node_modules
      - learnspace_runner_node_modules:/workspace/services/runner/node_modules
      - learnspace_worker_node_modules:/workspace/services/worker/node_modules
      - learnspace_web_next:/workspace/apps/web/.next
    command:
      - sh
      - -c
      - >-
        pnpm install --frozen-lockfile --fetch-timeout=180000
        && pnpm db:migrate && pnpm db:verify && pnpm db:seed:dev
        && pnpm --filter @learnspace/shared build && pnpm --filter @learnspace/db build
        && exec pnpm --filter @learnspace/web dev --hostname 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    restart: unless-stopped

  # Discovery worker: finds videos and papers through Exa and keeps YouTube metrics fresh.
  backend:
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1024m}
    image: learnspace-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      MALLOC_ARENA_MAX: "2"
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@postgres:5432/learnspace
      EXA_API_KEY: "${EXA_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      LEARNSPACE_SEMANTIC_DISCOVERY_ENABLED: "${LEARNSPACE_SEMANTIC_DISCOVERY_ENABLED:-true}"
      DISCOVERY_REQUEST_TIMEOUT_SECONDS: "${DISCOVERY_REQUEST_TIMEOUT_SECONDS:-8}"
      DISCOVERY_WORKER_INTERVAL_MS: "${DISCOVERY_WORKER_INTERVAL_MS:-30000}"
      DISCOVERY_WORKER_CONCURRENCY: "${DISCOVERY_WORKER_CONCURRENCY:-3}"
      EXA_DAILY_CALL_CAP: "${EXA_DAILY_CALL_CAP:-1000}"
      DISCOVERY_WORKER_MAX_JOBS: "${DISCOVERY_WORKER_MAX_JOBS:-0}"
      DISCOVERY_REFRESH_FAST_HOURS: "${DISCOVERY_REFRESH_FAST_HOURS:-24}"
      DISCOVERY_REFRESH_MEDIUM_HOURS: "${DISCOVERY_REFRESH_MEDIUM_HOURS:-24}"
      DISCOVERY_REFRESH_SLOW_HOURS: "${DISCOVERY_REFRESH_SLOW_HOURS:-72}"
      DISCOVERY_REFRESH_JITTER_PERCENT: "${DISCOVERY_REFRESH_JITTER_PERCENT:-0.1}"
      DISCOVERY_REFRESH_DEDUP_HOURS: "${DISCOVERY_REFRESH_DEDUP_HOURS:-12}"
      # YouTube Data API v3 key, restricted to that API. Without it the worker skips metrics.
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      YOUTUBE_DAILY_QUOTA_CAP: "${YOUTUBE_DAILY_QUOTA_CAP:-9000}"
      YOUTUBE_METRICS_MAX_AGE_DAYS: "${YOUTUBE_METRICS_MAX_AGE_DAYS:-7}"
      YOUTUBE_METRICS_BATCH_SIZE: "${YOUTUBE_METRICS_BATCH_SIZE:-200}"
      YOUTUBE_MIN_DURATION_SECONDS: "${YOUTUBE_MIN_DURATION_SECONDS:-60}"
      # Firecrawl key for the transcript fallback. Without it the fallback is skipped.
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
    depends_on:
      # The worker needs the schema, which the web container migrates.
      web:
        condition: service_healthy
    restart: unless-stopped

  # Signs caption URLs for local videos from this machine's home IP, then publishes and embeds the first download.
  transcript-signer:
    mem_limit: 256m
    # The backend's own image, so the signer can never run older worker code than the worker does.
    image: learnspace-backend
    command: ["node", "worker/dist/transcript-signer.js"]
    environment:
      DATABASE_WORKER_URL: postgres://learnspace_worker:learnspace_worker@postgres:5432/learnspace
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Fetches a transcript when no learner's browser could download it.
      FIRECRAWL_API_KEY: "${FIRECRAWL_API_KEY:-}"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  learnspace_postgres_data:
  learnspace_node_modules:
  learnspace_web_node_modules:
  learnspace_db_node_modules:
  learnspace_shared_node_modules:
  learnspace_runner_node_modules:
  learnspace_worker_node_modules:
  learnspace_web_next:
