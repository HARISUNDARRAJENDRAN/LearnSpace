appId: ai.learnspace.desktop
productName: LearnSpace
electronVersion: 44.7.0

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: dist-release-config.json
    to: release-config.json

asar: true
afterPack: scripts/after-pack-fuses.cjs

protocols:
  - name: LearnSpace
    schemes:
      - learnspace

linux:
  executableName: LearnSpace
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Education
  synopsis: AI-native learning, research, and knowledge-retention workspace
  maintainer: LearnSpace <noreply@learnspace.ai>
  vendor: LearnSpace
  desktop:
    entry:
      Name: LearnSpace
      Comment: AI-native learning workspace
      Categories: Education;Science;
      StartupWMClass: LearnSpace

appImage:
  artifactName: LearnSpace-${version}.${ext}

deb:
  packageName: learnspace
  artifactName: learnspace_${version}_${arch}.${ext}
