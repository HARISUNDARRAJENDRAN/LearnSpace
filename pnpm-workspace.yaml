packages:
  - apps/*
  - services/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
# No upstream release fixes this advisory. The checked-in patch bounds both
# brace and parenthesis nesting; dependency-security.test.ts covers entry points.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
